name: Build and Publish

on:
  push:
    branches:
      - master
    tags:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # Always generate the fresh credits and licenses pages
    - name: Build Pages (Credits & Licenses)
      run: |
        ./script/build-credits-page
        ./script/build-licenses-page

    # MASTER OR TAGS: Always build the CI Release APK so it can be verified on GitHub
    - name: Build CI Release (GitHub Pre-release / CI Test)
      run: ./gradlew assembleCiRelease
      env:
        KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        STORE_FILE: ${{ secrets.STORE_FILE }}

    # TAGS ONLY: Additionally build the Play Store production APK
    - name: Build Play Store Application
      if: startsWith(github.ref, 'refs/tags/')
      run: ./gradlew assemblePlayStoreRelease
      env:
        KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        STORE_FILE: ${{ secrets.STORE_FILE }}

    - name: Archive All Build Outputs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: outputs-apk
        path: |
          app/build/outputs/apk/**/*.apk

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
    - name: Retrieve built assets
      uses: actions/download-artifact@v4
      with:
        name: outputs-apk
        path: app/build/outputs/apk

    # STEP 1: Publish to GitHub Releases (Runs on master AND tags to serve as your "CI Test")
    - name: Publish to GitHub Pre-release (CI Test)
      if: github.ref == 'refs/heads/master' || (startsWith(github.ref, 'refs/tags/') && !contains(github.ref, 'refs/tags/pre-release'))
      uses: pyTooling/Actions/releaser@r0
      with:
        tag: pre-release
        token: ${{ secrets.GITHUB_TOKEN }}
        rm: true 
        files: |
          app/build/outputs/apk/ci/release/*.apk

    # STEP 2: Official release to Google Play (Runs ONLY for actual release tags)
    - name: Release to Play Store
      if: (startsWith(github.ref, 'refs/tags/') && !contains(github.ref, 'refs/tags/pre-release'))
      uses: r0adkll/upload-google-play@v1.1.3
      with:
        serviceAccountJsonPlainText: ${{secrets.SERVICE_ACCOUNT}}
        packageName: com.poupa.vinylmusicplayer
        releaseName: ${{ github.ref_name }}
        track: production
        releaseFiles: app/build/outputs/apk/playStore/release/*.apk
